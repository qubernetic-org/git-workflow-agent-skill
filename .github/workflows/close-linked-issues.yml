# Close linked issues when PRs are merged to non-default branches
#
# GitHub's built-in "Closes #X" keyword only auto-closes issues when merging
# to the DEFAULT branch (usually `main`). This workflow handles closing issues
# when PRs are merged to other branches like `develop`, `staging`, etc.
#
# References:
#   - GitHub docs confirm this limitation:
#     https://docs.github.com/en/issues/tracking-your-work-with-issues/using-issues/linking-a-pull-request-to-an-issue
#   - "Issues are only closed automatically on the repository's default branch."
#
# Supported keywords in PR body/title (case-insensitive):
#   close, closes, closed, fix, fixes, fixed, resolve, resolves, resolved

name: Close linked issues on merge

on:
  pull_request:
    types: [closed]

jobs:
  close-linked-issues:
    # Only run when PR is merged (not just closed) AND not targeting default branch
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Close linked issues
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prBody = context.payload.pull_request.body || '';
            const prTitle = context.payload.pull_request.title || '';
            const prNumber = context.payload.pull_request.number;
            const baseBranch = context.payload.pull_request.base.ref;

            console.log(`PR #${prNumber} merged into ${baseBranch}`);

            // --- Strategy 1: Parse closing keywords from PR body and title ---
            const closingKeywords = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi;
            const issueNumbers = new Set();

            for (const text of [prBody, prTitle]) {
              let match;
              while ((match = closingKeywords.exec(text)) !== null) {
                issueNumbers.add(parseInt(match[1], 10));
              }
            }

            // --- Strategy 2: Query the GraphQL API for linked issues ---
            // This catches issues linked via the GitHub UI sidebar, not just keywords.
            try {
              const query = `query($owner: String!, $repo: String!, $pr: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $pr) {
                    closingIssuesReferences(first: 50) {
                      nodes {
                        number
                        state
                        repository {
                          nameWithOwner
                        }
                      }
                    }
                  }
                }
              }`;

              const result = await github.graphql(query, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pr: prNumber,
              });

              const linkedIssues = result.repository.pullRequest.closingIssuesReferences.nodes;
              for (const issue of linkedIssues) {
                // Only close issues in the same repo
                const expectedRepo = `${context.repo.owner}/${context.repo.repo}`;
                if (issue.repository.nameWithOwner === expectedRepo && issue.state === 'OPEN') {
                  issueNumbers.add(issue.number);
                }
              }
            } catch (err) {
              console.log(`GraphQL query for linked issues failed (non-fatal): ${err.message}`);
            }

            if (issueNumbers.size === 0) {
              console.log('No linked issues found to close.');
              return;
            }

            console.log(`Found issues to close: ${[...issueNumbers].join(', ')}`);

            // Close each linked issue with a comment
            for (const issueNumber of issueNumbers) {
              try {
                // Verify the issue exists and is open
                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                });

                if (issue.state === 'closed') {
                  console.log(`Issue #${issueNumber} is already closed, skipping.`);
                  continue;
                }

                // Add a comment explaining the closure
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: `Closed by #${prNumber} (merged into \`${baseBranch}\`).`,
                });

                // Close the issue
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  state: 'closed',
                  state_reason: 'completed',
                });

                console.log(`Closed issue #${issueNumber}`);
              } catch (err) {
                console.error(`Failed to close issue #${issueNumber}: ${err.message}`);
              }
            }
